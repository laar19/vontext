version: '3.8'

services:
  builder:
    build:
      context: ..
      dockerfile: docker/Dockerfile.build
    volumes:
      # Código fuente del proyecto
      - ..:/project:cached
      # Output para los APKs
      - ./output:/output
    environment:
      - GRADLE_USER_HOME=/tmp/gradle-home
      - GRADLE_OPTS=-Xmx4g -Dorg.gradle.daemon=false
    working_dir: /project
    # Aumentar memoria para builds grandes
    mem_limit: 8g
